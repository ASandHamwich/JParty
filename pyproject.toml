[project]
name = "jparty"
# Read from jparty/version.py (see [tool.hatch.version]), the only place the version is set.
dynamic = ["version"]
description = "Jeopardy!-style party game: a desktop host app with phones as buzzers"
readme = "README.md"
license = { file = "LICENSE" }
# CI and the release builds use Python 3.11; newer versions may fail to build simpleaudio.
requires-python = ">=3.11,<3.12"
# Keep in sync with requirements.txt, which the release workflow installs from.
dependencies = [
    "PyQt6==6.9.1",
    "requests==2.32.4",
    "simpleaudio==1.0.4",
    "tornado==6.5.1",
    "BeautifulSoup4==4.11.1",
    "qrcode==7.3.1",
]

[dependency-groups]
dev = [
    "pyinstaller==6.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "jparty/version.py"

[tool.uv]
# JParty runs from source (cd jparty && python ../run.py) and is packaged with
# PyInstaller, so it is not installed into the environment as a package.
package = false
